<aside
  class="galactic-map-layers"
  data-testid="galactic-map-layers"
  aria-label="Capas temáticas del mapa galáctico"
>
  <div class="galactic-map-layers__heading">
    <small>CAPAS / 10.5</small>
    <span>VISIBILIDAD</span>
  </div>

  <div class="galactic-map-layers__grid">
    <button
      type="button"
      data-testid="galactic-map-layer-systems"
      [attr.aria-pressed]="visibility.systems"
      (click)="toggle(layerId.SYSTEMS)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--systems" aria-hidden="true"></i>
      Sistemas
    </button>

    <button
      type="button"
      data-testid="galactic-map-layer-nebulae"
      [attr.aria-pressed]="visibility.nebulae"
      (click)="toggle(layerId.NEBULAE)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--nebulae" aria-hidden="true"></i>
      Nebulosas
    </button>

    <button
      type="button"
      data-testid="galactic-map-layer-star-clusters"
      [attr.aria-pressed]="visibility.starClusters"
      (click)="toggle(layerId.STAR_CLUSTERS)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--clusters" aria-hidden="true"></i>
      Cúmulos
    </button>

    <button
      type="button"
      data-testid="galactic-map-layer-extreme-objects"
      [attr.aria-pressed]="visibility.extremeObjects"
      (click)="toggle(layerId.EXTREME_OBJECTS)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--extreme" aria-hidden="true"></i>
      Extremos
    </button>

    <button
      type="button"
      data-testid="galactic-map-layer-regions"
      [attr.aria-pressed]="visibility.regions"
      (click)="toggle(layerId.REGIONS)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--regions" aria-hidden="true"></i>
      Regiones
    </button>

    <button
      type="button"
      data-testid="galactic-map-layer-habitable-zone"
      [attr.aria-pressed]="visibility.habitableZone"
      (click)="toggle(layerId.HABITABLE_ZONE)"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--habitable" aria-hidden="true"></i>
      Región de habitabilidad galáctica
    </button>
    <button
      type="button"
      data-testid="galactic-map-layer-explored-shading"
      [attr.aria-pressed]="exploredShadingVisible"
      (click)="toggleExploredShading()"
    >
      <i class="galactic-map-layers__swatch galactic-map-layers__swatch--explored" aria-hidden="true"></i>
      Sombreado explorado
    </button>
  </div>

  <div class="galactic-map-layers__coverage" data-testid="galactic-map-exploration-coverage" aria-label="Sectores explorados y no explorados">
    <div class="galactic-map-layers__coverage-heading">SECTORES</div>
    <div class="galactic-map-layers__coverage-row">
      <i class="galactic-map-layers__coverage-swatch galactic-map-layers__coverage-swatch--explored" aria-hidden="true"></i>
      <span>Explorados</span>
      <strong data-testid="galactic-map-explored-sector-count">{{ explorationCoverage?.exploredSectorCount ?? 0 }}</strong>
    </div>
    <div class="galactic-map-layers__coverage-row">
      <i class="galactic-map-layers__coverage-swatch galactic-map-layers__coverage-swatch--unexplored" aria-hidden="true"></i>
      <span>No explorados</span>
      <strong data-testid="galactic-map-unexplored-sector-count">{{ unexploredSectorCount }}</strong>
    </div>
  </div>
</aside>
