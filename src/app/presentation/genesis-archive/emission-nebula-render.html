<div
  class="emission-nebula"
  data-testid="emission-nebula-render"
  [attr.data-knowledge-level]="descriptor().knowledgeLevel"
  [attr.data-nebula-variant]="descriptor().variant ?? 'GENERIC'"
>
  <canvas
    #canvas
    class="emission-nebula__canvas"
    role="img"
    [attr.aria-label]="descriptor().accessibleLabel"
  ></canvas>

  <div
    class="emission-nebula__optics"
    aria-hidden="true"
  ></div>
</div>
