<div
  class="agn-nucleus-render"
  data-testid="agn-nucleus-render"
>
  <div
    class="agn-nucleus-render__starfield"
    data-testid="agn-nucleus-render-starfield"
    aria-hidden="true"
  ></div>

  @if (blackHoleCoreModel) {
    <app-black-hole-laboratory-render
      class="agn-nucleus-render__black-hole-core"
      data-testid="agn-nucleus-render-canonical-smbh-core"
      [model]="blackHoleCoreModel"
      [embedded]="true"
    ></app-black-hole-laboratory-render>
  }
</div>
