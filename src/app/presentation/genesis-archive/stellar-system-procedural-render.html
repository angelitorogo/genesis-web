<section
  class="stellar-system-render"
  data-testid="stellar-system-procedural-render"
  [attr.data-knowledge-level]="descriptor().knowledgeLevel"
  [attr.data-multiplicity]="descriptor().multiplicity?.name ?? 'UNRESOLVED'"
>
  @if (renderModel(); as model) {
    <svg
      class="stellar-system-render__viewport"
      viewBox="0 0 100 100"
      role="img"
      [attr.aria-label]="descriptor().accessibleLabel"
    >
      <defs>
        <filter
          id="stellar-system-glow"
          x="-80%"
          y="-80%"
          width="260%"
          height="260%"
        >
          <feGaussianBlur
            stdDeviation="2.2"
            result="blur"
          ></feGaussianBlur>

          <feMerge>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      <circle
        class="stellar-system-render__field"
        cx="50"
        cy="50"
        r="47"
      ></circle>

      @if (model.habitableBand; as habitableBand) {
        <circle
          class="stellar-system-render__habitable-band"
          data-testid="stellar-system-render-habitable-zone"
          [attr.cx]="habitableBand.cx"
          [attr.cy]="habitableBand.cy"
          [attr.r]="habitableBand.radius"
          [attr.stroke-width]="habitableBand.strokeWidth"
        ></circle>
      }

      @for (orbit of model.orbits; track orbit.kind) {
        <ellipse
          class="stellar-system-render__orbit"
          [class.stellar-system-render__orbit--outer]="orbit.kind === 'outer'"
          [attr.data-orbit-kind]="orbit.kind"
          [attr.cx]="orbit.cx"
          [attr.cy]="orbit.cy"
          [attr.rx]="orbit.rx"
          [attr.ry]="orbit.ry"
        ></ellipse>
      }

      @for (component of model.components; track component.label) {
        <g
          class="stellar-system-render__component"
          [class.stellar-system-render__component--single-optical]="!model.unresolved && descriptor().multiplicity?.name === 'SINGLE'"
          [class.stellar-system-render__component--binary-optical]="!model.unresolved && descriptor().multiplicity?.name === 'BINARY'"
          [class.stellar-system-render__component--triple-optical]="!model.unresolved && descriptor().multiplicity?.name === 'TRIPLE'"
          [attr.data-component]="component.label"
          [attr.data-star-treatment]="model.unresolved ? 'UNRESOLVED_V1' : descriptor().multiplicity?.name === 'SINGLE' ? 'SINGLE_OPTICAL_V3' : descriptor().multiplicity?.name === 'BINARY' ? 'BINARY_OPTICAL_V1' : 'TRIPLE_OPTICAL_V1'"
        >
          @if (!model.unresolved) {
            <circle
              class="stellar-system-render__single-corona"
              data-testid="stellar-system-render-single-corona"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.lightProfile.coronaRadius"
              [attr.fill]="component.colorHex"
              [attr.opacity]="component.lightProfile.coronaOpacity"
            ></circle>

            <circle
              class="stellar-system-render__single-bloom"
              data-testid="stellar-system-render-single-bloom"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.lightProfile.bloomRadius"
              [attr.fill]="component.colorHex"
              [attr.opacity]="component.lightProfile.bloomOpacity"
            ></circle>

            <circle
              class="stellar-system-render__single-aureole"
              data-testid="stellar-system-render-single-aureole"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.lightProfile.aureoleRadius"
              [attr.fill]="component.colorHex"
              [attr.opacity]="component.lightProfile.aureoleOpacity"
            ></circle>

            <g
              class="stellar-system-render__single-diffraction stellar-system-render__single-diffraction--soft"
              data-testid="stellar-system-render-single-diffraction-soft"
              [attr.opacity]="component.lightProfile.diffractionSoftOpacity"
              [attr.stroke]="component.colorHex"
            >
              <path
                [attr.d]="'M ' + (component.x - component.lightProfile.diffractionSoftLength * 0.82) + ' ' + component.y + ' H ' + (component.x + component.lightProfile.diffractionSoftLength * 0.82) + ' M ' + component.x + ' ' + (component.y - component.lightProfile.diffractionSoftLength * 1.08) + ' V ' + (component.y + component.lightProfile.diffractionSoftLength * 1.08)"
              ></path>
            </g>

            <g
              class="stellar-system-render__single-diffraction stellar-system-render__single-diffraction--shoulder"
              data-testid="stellar-system-render-single-diffraction-shoulder"
              [attr.opacity]="component.lightProfile.diffractionShoulderOpacity"
              [attr.stroke]="component.lightProfile.diffractionColorHex"
            >
              <path
                [attr.d]="'M ' + (component.x - component.lightProfile.diffractionShoulderLength * 0.94) + ' ' + component.y + ' H ' + (component.x + component.lightProfile.diffractionShoulderLength * 0.94) + ' M ' + component.x + ' ' + (component.y - component.lightProfile.diffractionShoulderLength * 1.22) + ' V ' + (component.y + component.lightProfile.diffractionShoulderLength * 1.22)"
              ></path>
            </g>

            <g
              class="stellar-system-render__single-diffraction stellar-system-render__single-diffraction--primary"
              data-testid="stellar-system-render-single-diffraction"
              [attr.opacity]="component.lightProfile.diffractionPrimaryOpacity"
              [attr.stroke]="component.lightProfile.diffractionColorHex"
            >
              <path
                [attr.d]="'M ' + (component.x - component.lightProfile.diffractionPrimaryLength * 0.70) + ' ' + component.y + ' H ' + (component.x + component.lightProfile.diffractionPrimaryLength * 0.70) + ' M ' + component.x + ' ' + (component.y - component.lightProfile.diffractionPrimaryLength * 1.18) + ' V ' + (component.y + component.lightProfile.diffractionPrimaryLength * 1.18)"
              ></path>
            </g>

            <g
              class="stellar-system-render__single-diffraction stellar-system-render__single-diffraction--secondary"
              data-testid="stellar-system-render-single-diffraction-secondary"
              [attr.opacity]="component.lightProfile.diffractionSecondaryOpacity"
              [attr.stroke]="component.lightProfile.diffractionColorHex"
            >
              <path
                [attr.d]="'M ' + (component.x - component.lightProfile.diffractionSecondaryLength) + ' ' + (component.y - component.lightProfile.diffractionSecondaryLength) + ' L ' + (component.x + component.lightProfile.diffractionSecondaryLength) + ' ' + (component.y + component.lightProfile.diffractionSecondaryLength) + ' M ' + (component.x + component.lightProfile.diffractionSecondaryLength) + ' ' + (component.y - component.lightProfile.diffractionSecondaryLength) + ' L ' + (component.x - component.lightProfile.diffractionSecondaryLength) + ' ' + (component.y + component.lightProfile.diffractionSecondaryLength)"
              ></path>
            </g>

            @if (component.lightProfile.hasMicroDiffraction) {
              <g
                class="stellar-system-render__single-diffraction stellar-system-render__single-diffraction--micro"
                data-testid="stellar-system-render-single-diffraction-micro"
                [attr.opacity]="component.lightProfile.diffractionMicroOpacity"
                [attr.stroke]="component.lightProfile.diffractionColorHex"
                [attr.transform]="'rotate(22.5 ' + component.x + ' ' + component.y + ')'"
              >
                <path
                  [attr.d]="'M ' + (component.x - component.lightProfile.diffractionMicroLength) + ' ' + component.y + ' H ' + (component.x + component.lightProfile.diffractionMicroLength) + ' M ' + component.x + ' ' + (component.y - component.lightProfile.diffractionMicroLength) + ' V ' + (component.y + component.lightProfile.diffractionMicroLength)"
                ></path>
              </g>
            }

            <circle
              class="stellar-system-render__single-photosphere"
              data-testid="stellar-system-render-single-photosphere"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.radius"
              [attr.fill]="component.colorHex"
              [attr.stroke]="component.colorHex"
            ></circle>
          } @else {
            <circle
              class="stellar-system-render__star-halo"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.radius * 1.9"
              [attr.fill]="component.colorHex"
            ></circle>

            <circle
              class="stellar-system-render__star"
              filter="url(#stellar-system-glow)"
              [attr.cx]="component.x"
              [attr.cy]="component.y"
              [attr.r]="component.radius"
              [attr.fill]="component.colorHex"
            ></circle>
          }

          @if (!model.unresolved) {
            <text
              class="stellar-system-render__component-label"
              [attr.x]="component.x"
              [attr.y]="component.y + component.radius + 7"
              text-anchor="middle"
            >
              {{ component.label }}
            </text>
          }
        </g>
      }

      @if (!model.unresolved && (descriptor().multiplicity?.name === 'BINARY' || descriptor().multiplicity?.name === 'TRIPLE')) {
        <g
          class="stellar-system-render__barycentre stellar-system-render__barycentre--foreground"
          data-testid="stellar-system-render-barycentre"
        >
          <circle
            [attr.cx]="model.barycentreX"
            [attr.cy]="model.barycentreY"
            r="1.3"
          ></circle>

          <path
            [attr.d]="'M ' + (model.barycentreX - 3) + ' ' + model.barycentreY + ' h 6 M ' + model.barycentreX + ' ' + (model.barycentreY - 3) + ' v 6'"
          ></path>
        </g>
      }

      @if (model.unresolved) {
        <circle
          class="stellar-system-render__unresolved-ring"
          cx="50"
          cy="50"
          r="14"
        ></circle>

        <text
          class="stellar-system-render__unresolved-label"
          x="50"
          y="76"
          text-anchor="middle"
        >
          SEÑAL NO RESUELTA
        </text>
      }
    </svg>

    <footer class="stellar-system-render__legend">
      <span>{{ !model.unresolved && descriptor().multiplicity?.name === 'SINGLE' ? 'RENDER ESTELAR PROCEDURAL' : 'ESQUEMA ORBITAL PROCEDURAL' }}</span>
      <span>NO A ESCALA</span>

      @if (model.habitableBand) {
        <span class="stellar-system-render__legend-hz">
          HZ ESTABLE
        </span>
      }
    </footer>
  }
</section>
